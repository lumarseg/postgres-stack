# Inventario del Cluster PostgreSQL HA
#
# node_priority: Prioridad unificada para Keepalived y Patroni
#   - Mayor numero = mayor prioridad
#   - El nodo con mayor prioridad sera MASTER de la VIP
#   - El nodo con mayor prioridad sera preferido como lider PostgreSQL en failover
#
# keepalived_state: Estado inicial de Keepalived (MASTER/BACKUP)
#   - Solo un nodo debe ser MASTER (el de mayor prioridad)
#
# router_id: Identificador unico para Keepalived (01, 02, 03...)
#
# Tags de Patroni (controlan comportamiento de replicas):
#   - nofailover: true = nunca sera promovido a Leader (replica permanente)
#   - noloadbalance: true = excluido del balanceo de lectura en HAProxy
#   - nosync: true = nunca sera replica sincrona (siempre asincrona)
#   - clonefrom: false = no se usara como fuente para clonar nuevos nodos
#
# Nota: Patroni usa el hostname del sistema (vm05, vm06, vm07) como nombre
#       del miembro, lo cual facilita identificar la VM en Proxmox.

all:
  children:
    postgres_cluster:
      hosts:
        vm05:
          ansible_host: 192.168.37.15
          etcd_name: etcd01
          node_priority: 100
          keepalived_state: MASTER
          router_id: "01"
          # Patroni tags
          nofailover: false
          noloadbalance: false
          nosync: false
          clonefrom: true
        vm06:
          ansible_host: 192.168.37.16
          etcd_name: etcd02
          node_priority: 99
          keepalived_state: BACKUP
          router_id: "02"
          nofailover: false
          noloadbalance: false
          nosync: false
          clonefrom: true
        vm07:
          ansible_host: 192.168.37.17
          etcd_name: etcd03
          node_priority: 98
          keepalived_state: BACKUP
          router_id: "03"
          nofailover: false
          noloadbalance: false
          nosync: false
          clonefrom: true
