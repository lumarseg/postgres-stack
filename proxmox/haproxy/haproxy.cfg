global
    maxconn 1000
    log stdout format raw local0

defaults
    log global
    mode tcp
    retries 3
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 10s

listen postgres
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server db01 192.168.37.16:5432 maxconn 100 check port 8008
    server db02 192.168.37.17:5432 maxconn 100 check port 8008
    server db03 192.168.37.18:5432 maxconn 100 check port 8008
